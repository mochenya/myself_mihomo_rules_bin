# 外部规则集
rule-anchor:
  ip_mrs:
    &ip_mrs {
      type: http,
      interval: 86400,
      behavior: ipcidr,
      format: mrs,
      proxy: Proxy,
    }
  domain_yaml:
    &domain_yaml {
      type: http,
      interval: 86400,
      behavior: domain,
      format: yaml,
      proxy: Proxy,
    }
  domain_mrs:
    &domain_mrs {
      type: http,
      interval: 86400,
      behavior: domain,
      format: mrs,
      proxy: Proxy,
    }
  domain_text:
    &domain_text {
      type: http,
      interval: 86400,
      behavior: domain,
      format: text,
      proxy: Proxy,
    }
  class_yaml:
    &class_yaml {
      type: http,
      interval: 86400,
      behavior: classical,
      format: yaml,
      proxy: Proxy,
    }

rule-providers:
  private_domain:
    <<: *domain_mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
    path: "./ruleset/meta-rules-dat/geosite/private.mrs"

  fake_ip_filter_text:
    <<: *domain_text
    url: "https://raw.githubusercontent.com/juewuy/ShellCrash/refs/heads/dev/public/fake_ip_filter.list"
    path: "./ruleset/meta-rules-dat/list/fake_ip_filter.list"

  private_ip:
    <<: *ip_mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"
    path: "./ruleset/meta-rules-dat/geoip/private.mrs"

  cn_domain:
    <<: *domain_mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
    path: "./ruleset/meta-rules-dat/geosite/cn.mrs"

  cn_ip:
    <<: *ip_mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
    path: "./ruleset/meta-rules-dat/geoip/cn.mrs"

  geolocation-!cn_domain:
