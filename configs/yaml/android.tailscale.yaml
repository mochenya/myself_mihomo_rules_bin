# 基础监听与通用设置
mixed-port: 7890
allow-lan: false
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true # 存储上次选择的节点
  store-fake-ip: true # 持久化 Fake-IP 映射

# GeoIP/GeoSite 数据库配置
geodata-loader: memconservative
geo-auto-update: false # 关闭自动更新，减少后台定时下载与检查
geo-update-interval: 24 # 保留间隔配置，后续如重新开启自动更新可直接复用
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

# Tailscale 私有网络出站
proxies:
  - name: Tailscale-Node
    type: tailscale
    hostname: mihomo-android
    auth-key: ""
    state-dir: ./tailscale # 持久化设备身份与登录状态
    ephemeral: false # 不创建临时节点，避免每次启动重复注册
    udp: true # 允许 UDP 流量通过 Tailscale
    accept-routes: true # 接受 Tailnet 其他设备发布的子网路由
    # exit-node: 100.x.y.z # 可选：需要 Tailscale 公网出口时指定出口节点 IP
    # exit-node-allow-lan-access: true # 可选：使用出口节点时允许访问本地 LAN

# 代理订阅
provider-base: &provider-base
  type: http
  interval: 86400
  exclude-filter: "(?i)剩余流量|到期时间|套餐到期|订阅更新"
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 600 # 使用中的订阅集合每 10 分钟检查节点健康状态
    timeout: 5000
    lazy: true # 订阅集合未被使用时跳过周期检查，并非仅检查所选节点

proxy-providers:
  Airport-One:
    <<: *provider-base
    url: ""
    path: "./providers/airport-one.yaml"
    override:
      additional-prefix: "[A1] "

  Airport-Two:
    <<: *provider-base
    url: ""
    path: "./providers/airport-two.yaml"
    override:
      additional-prefix: "[A2] "

  Airport-Three:
    <<: *provider-base
    url: ""
    path: "./providers/airport-three.yaml"
    override:
      additional-prefix: "[❄️] "

# DNS 解析设置
dns:
  enable: true
  listen: "127.0.0.1:1053"
  ipv6: true
  prefer-h3: false
  respect-rules: false # 下方 DNS 上游均通过 #DIRECT / #Proxy 显式指定出口
  use-system-hosts: true
  cache-algorithm: arc
  enhanced-mode: fake-ip # 增强模式: Fake-IP
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: # Fake-IP 过滤列表 (直接返回真实IP的域名)
    - "rule-set:fake_ip_filter_text"
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "+.ts.net" # Tailnet MagicDNS 返回真实 IP，避免虚拟地址影响规则匹配
  default-nameserver: # 引导 DNS (用于解析 DoH 域名)
    - "tls://223.5.5.5#DIRECT"
  nameserver: # 未分类域名由境外 DNS 兜底，出口跟随主策略组 Proxy
    - "https://1.1.1.1/dns-query#Proxy"
    - "https://8.8.8.8/dns-query#Proxy"
  proxy-server-nameserver: # 独立直连解析代理节点域名，避免循环依赖
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  direct-nameserver: # DIRECT 出站域名解析
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  direct-nameserver-follow-policy: false
  nameserver-policy: # 按域名区分解析上游
    "+.ts.net": # MagicDNS 通过内嵌 Tailscale 节点解析
      - "ts://Tailscale-Node"
    "rule-set:cn_domain,tld-cn_domain,microsoft@cn_domain,filter":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"

# 策略组配置模板
# select 类型策略组基础配置（手动选择，无需健康检查）
select-base: &select-base {}
# url-test/fallback 策略组的健康检查配置
group-base: &group-base
  interval: 600 # 与 provider 保持一致，同 URL 的订阅节点检查由 provider 复用
  lazy: true # 未切换到当前策略组时不主动测速
  timeout: 5000
  url: "https://www.gstatic.com/generate_204"
  expected-status: 204
  max-failed-times: 2 # 连接失败达到阈值时触发强制健康检查
  # hidden: true

# 地区分组基础配置（继承 group-base 的健康检查参数）
region-base: &region-base
  <<: *group-base # 合并健康检查配置
  type: url-test
  use:
    - Airport-One
    - Airport-Two
    - Airport-Three
  tolerance: 50
  empty-fallback: REJECT # 地区组没有候选节点时明确拒绝，避免空组回退直连
  # hidden: true

# 策略组
proxy-groups:
  # Tailscale 私有网络策略组
  - name: Tailscale
    type: select
    <<: *select-base
    proxies:
      - Tailscale-Node # 默认选择原生 Tailscale 出站节点
      - REJECT # 手动拒绝 Tailnet 访问，不回退普通代理

  # 主策略组
  - name: Proxy
    type: select
    <<: *select-base
    proxies:
      - AUTO
      - "🇭🇰 | 香港 HK"
      - "🇹🇼 | 台湾 TW"
      - "🇯🇵 | 日本 JP"
      - "🇰🇷 | 韩国 KR"
      - "🇺🇸 | 美国 US"
      - "🇩🇪 | 德国 DE"
      - "🇸🇬 | 新加坡 SG"
      - "🇫🇷 | 法国 FR"
      - "🇬🇧 | 英国 UK"
      - DIRECT
      - REJECT
    # 包含订阅节点，支持手动选择
    include-all: true
    exclude-filter: "^Tailscale-Node$" # 不将 Tailnet 私有出站混入机场节点选择
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png

  - name: AUTO
    type: url-test
    <<: *group-base
    use:
      - Airport-One
      - Airport-Two
      - Airport-Three
    tolerance: 50 # 新节点至少快 50ms 才切换；设为 0 可严格追随最低延迟，但更容易抖动
