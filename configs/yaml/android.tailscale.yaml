    path: "./ruleset/mochen/filter.yaml"

# 路由规则（从上到下匹配）
rules:
  # Tailscale 私有网络：优先于本地 private_ip/private_domain 规则
  - DOMAIN-SUFFIX,ts.net,Tailscale # Tailnet MagicDNS 完整域名
  - IP-CIDR,100.64.0.0/10,Tailscale,no-resolve # Tailnet IPv4；注意运营商 CGNAT 也可能使用此范围
  # - IP-CIDR,192.168.50.0/24,Tailscale,no-resolve # 可选：改成你自己发布的子网路由

  # 本地绕行
  - RULE-SET,private_ip,GlobalDirect,no-resolve
  - RULE-SET,filter,GlobalDirect
  - RULE-SET,private_domain,GlobalDirect

  # 广告拦截
  - RULE-SET,category-ads_domain,GlobalBlock
  # - RULE-SET,xiaomi-ads_domain,GlobalBlock
  # - RULE-SET,google-ads_domain,GlobalBlock

  # Gemini 独立分流，须位于通用 AI 和 Google 前
  - RULE-SET,google_gemini,Gemini

  # Claude 独立分流，须位于通用 AI 前
  - RULE-SET,anthropic_domain,Claude

  # 境外 AI 服务汇总，须位于 Google 前
  - RULE-SET,category_ai_non_cn_domain,AI

  # Google
  - RULE-SET,google_domain,Google

  # Microsoft CN
  - RULE-SET,microsoft@cn_domain,GlobalDirect

  # 地区分流与兜底
  - RULE-SET,cn_domain,GlobalDirect
  - RULE-SET,tld-cn_domain,GlobalDirect
  - RULE-SET,geolocation-!cn_domain,Proxy

  # IP 规则与最终兜底
  - RULE-SET,telegram_ip,Proxy,no-resolve
  - RULE-SET,cn_ip,GlobalDirect,no-resolve
  - MATCH,Proxy
